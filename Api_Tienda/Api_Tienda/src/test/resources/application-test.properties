# =============================================================================
# SITFAI ERP -- Perfil de Pruebas (CI/Integration Tests)
# Overrides de configuracion para entornos sin Keycloak disponible
# =============================================================================

# Desactivar seguridad OAuth2 en pruebas de integracion
# spring.security.oauth2.resourceserver.jwt.issuer-uri=
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Reducir logging ruido en CI
logging.level.root=WARN
logging.level.com.SITFAI_CORE_ERP_TIENDA=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=WARN

# Testcontainers se encarga de la BD -- no hay pool innecesario
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Placeholder exclusivo de tests. Las pruebas E2E que levantan Keycloak lo sobrescriben.
keycloak.admin.client-secret=test-only-placeholder-not-a-production-secret
