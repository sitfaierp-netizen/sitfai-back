# =============================================================================
# SITFAI ERP â€” MÃ³dulo: Api_Tienda (com.SITFAI_CORE_ERP_TIENDA)
# Artefacto: Api_Tienda
# Spring Boot: 4.0.7 | Java: 25
# Estado: ConfiguraciÃ³n Segura de Infraestructura (ADR-007, ADR-008, ADR-010)
# =============================================================================
# âš ï¸  VARIABLES DE ENTORNO REQUERIDAS (InyecciÃ³n dinÃ¡mica â€” Cero contraseÃ±as quemadas):
#     DB_HOST     (Default: localhost)
#     DB_PORT     (Default: 3306)
#     DB_NAME     (Default: tienda)
#     DB_USER     (Default: root)
#     DB_PASSWORD (Obligatorio en variables de entorno / Secret Manager)
# =============================================================================

# =============================================================================
# SECCIÃ“N 1 â€” SERVIDOR
# =============================================================================
server.port=8085
server.servlet.context-path=/api/v1
server.shutdown=graceful

# CompresiÃ³n de respuesta HTTP
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024

# =============================================================================
# SECCIÃ“N 2 â€” NOMBRE DE LA APLICACIÃ“N
# =============================================================================
spring.application.name=api-tienda

# =============================================================================
# SECCIÃ“N 3 â€” BASE DE DATOS (MySQL 8+)
# ADR-007: Cero credenciales quemadas en properties.
# =============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sitfai_tienda}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER:sitfai_user}
spring.datasource.password=${DB_PASSWORD:sitfai_secret_pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=HikariPool-ApiTienda
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# SECCIÃ“N 4 â€” JPA / HIBERNATE
# ADR-008: 'update' transitorio en desarrollo local -> 'validate' con Flyway.
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate

# AntipatrÃ³n Open-In-View desactivado (Regla Arquitectura)
spring.jpa.open-in-view=false

# SQL Logging (Solo para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# OptimizaciÃ³n Batching
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =============================================================================
# SECCIÃ“N 5 â€” NAMING STRATEGY (snake_case obligatorio en BD â€” Regla 6)
# =============================================================================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# =============================================================================
# SECCIÃ“N 6 â€” FLYWAY (Migraciones de BD â€” Regla 6)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# =============================================================================
# SECCIÃ“N 7 â€” ACTUATOR (MÃ©tricas y Salud)
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=SITFAI ERP â€” Api Tienda
info.app.module=com.SITFAI_CORE_ERP_TIENDA
info.app.version=0.0.1-SNAPSHOT
info.app.environment=development

# =============================================================================
# SECCIÃ“N 8 â€” LOGGING
# =============================================================================
logging.level.root=INFO
logging.level.com.SITFAI_CORE_ERP_TIENDA=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [API-TIENDA] %-5level %logger{36} - %msg%n

# =============================================================================
# SECCIÃ“N 9 â€” SEGURIDAD / KEYCLOAK IAM (ADR-002, Regla 7)
# =============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:sitfai-erp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:sitfai-erp}/protocol/openid-connect/certs
# =============================================================================
# SECCIÃ“N 10 â€” KEYCLOAK ADMIN CLIENT (ADR-002, ADR-007, SincronizaciÃ³n IAM)
# =============================================================================
keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:sitfai-erp}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# =============================================================================
# SECCIÃ“N 11 â€” SWAGGER UI OAUTH2 CLIENT
# =============================================================================
springdoc.swagger-ui.oauth.clientId=api-tienda-client
springdoc.swagger-ui.oauth.useBasicAuthenticationWithAccessCodeGrant=true

# =============================================================================
# SECCIN 12 - SWAGGER PATH FIX
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
