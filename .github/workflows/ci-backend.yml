name: CI Backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test and Verify with Maven
        working-directory: Api_Tienda/Api_Tienda
        run: |
          chmod +x mvnw
          ./mvnw clean verify
        
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: Api_Tienda/Api_Tienda/target/site/jacoco/
          
      - name: Upload OWASP Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: Api_Tienda/Api_Tienda/target/dependency-check-report.html

      - name: Print Surefire Reports on Failure
        if: failure()
        working-directory: Api_Tienda/Api_Tienda
        run: |
          for file in target/surefire-reports/*.txt; do
            echo "=== $file ==="
            cat "$file" || true
          done
