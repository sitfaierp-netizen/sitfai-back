name: CI Backend

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data/
          key: ${{ runner.os }}-dependency-check-v12
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Build, Test and Verify with Maven
        working-directory: Api_Tienda/Api_Tienda
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify
        
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: Api_Tienda/Api_Tienda/target/site/jacoco/
          if-no-files-found: ignore
          
      - name: Upload OWASP Dependency-Check Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: Api_Tienda/Api_Tienda/target/dependency-check-report.html
          if-no-files-found: ignore

      - name: Upload Maven Test Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-test-reports
          path: |
            Api_Tienda/Api_Tienda/target/surefire-reports/
            Api_Tienda/Api_Tienda/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Print Surefire Reports on Failure
        if: failure()
        working-directory: Api_Tienda/Api_Tienda
        run: |
          find target/surefire-reports target/failsafe-reports -type f -name '*.txt' -print 2>/dev/null | while read -r file; do
            echo "=== $file ==="
            cat "$file"
          done
